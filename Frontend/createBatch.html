<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thêm lô nguyên liệu mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 700;
        }

        .form-label {

            font-weight: 600;
            color: #444;
        }

        .btn-success {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Thêm lô nguyên liệu mới</h2>

        <form id="createForm">

            <div class="mb-4">
                <label class="form-label">Nguyên liệu</label>
                <select class="form-select" id="ingredientId" required>
                    <option value="">-- Chọn nguyên liệu --</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Số lượng nhập</label>
                <input type="number" class="form-control" id="quantityImported" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Giá (VND)</label>
                <input type="number" class="form-control" id="batchPrice" required>
            </div>

            <div class="mb-4"> 
                <label class="form-label fw-semibold">Hạn sử dụng</label> 
                <input type="date" class="form-control" id="expiryDate" required> 
            </div>

            <button type="submit" class="btn btn-success">Thêm lô nguyên liệu</button>
            <a href="ingredientBatch.html" class="btn btn-secondary">Quay lại</a>
        </form>
    </div>

    <script src="js/createBatch.js"></script>
</body>

</html>
