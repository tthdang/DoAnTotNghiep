                </ul>
            </li>
        </ul>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Core</div>
                        <a class="nav-link collapsed" href="#" data-bs-toggle="collapse"
                            data-bs-target="#collapseDashboard" aria-expanded="false">

                            <div class="sb-nav-link-icon">
                                <i class="fas fa-tachometer-alt"></i>
                            </div>
                            Dashboard

                            <div class="sb-sidenav-collapse-arrow">
                                <i class="fas fa-angle-down"></i>
                            </div>
                        </a>

                        <div class="collapse" id="collapseDashboard">
                            <nav class="sb-sidenav-menu-nested nav">

                                <a class="nav-link" href="index.html">
                                    Thống kê
                                </a>
                                <!-- Thống kê theo ca -->
                                <a class="nav-link" href="reportShift.html">
                                    Thống kê theo ca
                                </a>


                            </nav>
                        </div>



                        <div class="sb-sidenav-menu-heading">Addons</div>
                        <a class="nav-link" href="Ingredient.html">

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4 mb-4">
                        Quản lý Bàn
                    </h1>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="createTable.html" class="btn btn-primary">
                            Thêm bàn mới
                        </a>
                        </br>
                    </div>
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-table me-1"></i>
                            Danh sách bàn nhà hàng BeefChef
                        </div>
                        <div class="card-body">
                            <!-- Filter -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="d-flex gap-3">
                                    <input type="text" id="searchInput" class="form-control" style="width: 280px;"
                                        placeholder="Tìm kiếm bàn..." onkeyup="filterTables()">

                                    <select id="statusFilter" class="form-select" style="width: 180px;"
                                        onchange="filterTables()">
                                        <option value="">Tất cả trạng thái</option>
                                        <option value="AVAILABLE">Trống</option>
                                        <option value="OCCUPIED">Đang dùng</option>
                                    </select>
                                </div>


                            </div>


                            <div id="tableGrid" class="table-grid">

                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">BeefChef Restaurant © 2026</div>
                    </div>
                </div>
            </footer>
        </div>
    </div>


    <div class="modal fade" id="addTableModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm bàn mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tên bàn</label>
                        <input type="text" id="newTableName" class="form-control" placeholder="Ví dụ: Bàn số 9">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số chỗ ngồi</label>
                        <input type="number" id="newCapacity" class="form-control" value="4" min="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="addNewTable()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/table.js"></script>
