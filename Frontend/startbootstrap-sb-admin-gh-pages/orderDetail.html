<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Order</title>

    <link href="css/styles.css" rel="stylesheet">
    <link href="css/table.css" rel="stylesheet">
    <link href="css/order.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fc;
            padding-top: 30px;
        }

        .card {
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
        }

        .btnMarkPaid {
            padding: 16px;
            margin-right: 50px;
        }


        .payment-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
        }

        .payment-btn {
            margin-right: 200px;
        }

        .promo-code-inline {
            padding-top: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .promo-label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .promo-input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .promo-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
            outline: none;
        }

        .promo-btn {
            padding: 8px 14px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .promo-btn:hover {
            background-color: #0056b3;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .summary-item:last-child {
            margin-bottom: 0;
            border-top: 2px solid #ddd;
            padding-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

        table tbody tr:hover {
            background-color: #f1f9ff;
        }

        .status-order-item {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .rank-discount {
            font-size: 10px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Chi tiết Order</h1>
            <a href="tables.html" class="btn btn-secondary">← Quay lại danh sách bàn</a>
        </div>

        <div class="row">
            <!-- Thông tin Order -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Thông tin Order</h6>
                    </div>
                    <div class="card-body">
                        <p><strong>Bàn:</strong> <span id="tableName" class="text-primary fw-bold"></span></p>
                        <p><strong>Order ID:</strong> <span id="orderId"></span></p>
                        <p>
                            <strong>Khách hàng:</strong>
                            <span id="customerName"></span>
                            (<span id="userRank" class="text-warning fw-bold"></span>)
                        </p>
                        <p><strong>Thời gian tạo:</strong> <span id="createdAt"></span></p>
                        <p><strong>Trạng thái:</strong> <span id="statusBadge" class="status-badge"></span></p>

                        <div class="summary-item">
                            <span>Tổng tiền:</span>
                            <span id="totalAmount" class="text-muted"></span>
                        </div>


                        <div class="summary-item">
                            <span>Giảm giá:</span>
                            <span id="discountAmount" class="text-success"></span>
                        </div>
                        <div class="summary-item">
                            <span>Giảm rank:</span>
                            <span id="userRankDiscount" class="text-info"></span>
                        </div>
                        <div class="summary-item">
                            <span class="fs-5">Thành tiền:</span>
                            <span id="finalAmount" class="text-danger fs-5"></span>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Danh sách món -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header py-3 d-flex justify-content-between">
                        <h6 class="m-0 font-weight-bold text-primary">Danh sách món đã gọi</h6>

                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Món ăn</th>
                                    <th class="text-center">Số lượng</th>
                                    <th class="text-end">Đơn giá</th>
                                    <th class="text-center">Trạng thái</th>
                                    <th class="text-end">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody">

                            </tbody>

                        </table>

                    </div>
                </div>
                <div class="promo-code-inline">
                    <label for="promo" class="promo-label">Mã khuyến mãi:</label>
                    <input type="text" id="promo" class="promo-input" placeholder="Nhập mã">
                    <button class="promo-btn">Áp dụng</button>
                </div>


                <div class="text-end mt-4">
                    <button id="btnMarkPaid" class="btn btn-success btn-lg px-5">
                        Thanh Toán
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/orderDetail.js"></script>

</body>

</html>
