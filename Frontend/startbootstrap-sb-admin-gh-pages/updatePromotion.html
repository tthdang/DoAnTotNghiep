<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title> Cập nhật mã khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 700;
        }

        .form-label {

            font-weight: 600;
            color: #444;
        }

        .btn-success {
            width: 207px;
            padding: 0px 0px;
            font-weight: 600;
            border-radius: 8px;
            margin-left: 50px;
        }

        .btn-secondary {
            width: 207px;
            padding: 20px;
            border-radius: 8px;

        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2> Cập nhật mã khuyến mãi mới</h2>

        <form id="updateForm">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Mã khuyến mãi </label>
                    <input type="text" class="form-control" id="code" placeholder="KHUYENMAI10K" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Loại khuyến mãi</label>
                    <select class="form-select" id="promotionType">
                        <option value="ORDER" selected>Khuyến mãi theo đơn hàng</option>
                        <option value="PRODUCT">Khuyến mãi theo sản phẩm</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Loại giảm giá</label>
                    <select class="form-select" id="discountType">
                        <option value="PERCENT" selected>Phần trăm (%)</option>
                        <option value="FIXED">Số tiền cố định (VND)</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Giá trị giảm </label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="discountValue" placeholder="10" min="1" required>
                        <span class="input-group-text" id="discountUnit">%</span>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Giá trị đơn tối thiểu</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="minOrderValue" placeholder="300000"
                            placeholder="300000">
                        <span class="input-group-text">đ</span>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Giảm tối đa</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="maxDiscountValue" placeholder="10000"
                            placeholder="10000">
                        <span class="input-group-text">đ</span>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ngày bắt đầu</label>
                    <input type="date" class="form-control" id="startDate">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ngày kết thúc</label>
                    <input type="date" class="form-control" id="endDate">
                </div>

                <div class="col-12">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" id="status" required>
                        <option value="AVAILABLE">Còn mã</option>
                        <option value="OUT_OF_STOCK">Hết mã</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số lần sử dụng tối đa</label>
                    <input type="number" class="form-control" id="usageLimit" min="1"
                        placeholder="Số lượt sử dụng (0 = không giới hạn)">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số lần đã được sử dụng</label>
                    <input type="number" class="form-control" id="usedCount" >
                </div>

                
            </div>

            <div class="d-flex justify-content-between mt-5">
                <a href="promotion.html" class="btn btn-secondary px-4">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-success px-5 py-2">
                    <i class="fas fa-check-circle"></i> Cập nhật mã khuyến mãi
                </button>
            </div>
        </form>
    </div>

    <script src="js/updatePromotion.js"></script>
</body>

</html>
