<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeefChef — Thực Đơn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="css/order.css" />
</head>
<body>

<div class="order-page">

  <!-- ── NAVBAR ── -->
  <nav class="order-nav">
    <!-- Logo -->
    <div class="nav-logo"><span>Beef</span><span>Chef</span></div>

    <!-- Category tabs (rendered by JS) -->
    <div class="nav-tabs" id="navTabs" role="tablist" aria-label="Danh mục món ăn">
      <!-- JS renders tabs here -->
    </div>

    <!-- Right actions -->
    <div class="nav-actions">
      <div class="nav-table-info">
        <div>Bàn: <strong id="navTableName">—</strong></div>
        <div id="navPhone" style="color:var(--text-muted)"></div>
      </div>
      <button class="btn-cart-nav" id="cartBtn" aria-label="Mở giỏ hàng">
        🛒 Giỏ hàng
        <span class="cart-badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </nav>

  <!-- ── MENU BODY ── -->
  <main class="menu-body">

    <!-- Search -->
    <div class="menu-search-wrap">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <input type="search" class="menu-search-input" id="menuSearchInput"
             placeholder="Tìm kiếm món ăn..." autocomplete="off"
             aria-label="Tìm kiếm món ăn" />
    </div>

    <!-- Sections rendered by JS -->
    <div id="menuContent" aria-live="polite"></div>

  </main>

</div><!-- /order-page -->


<!-- ══════════════════════════════════════════
     CART DRAWER
════════════════════════════════════════════ -->
<div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>

<aside class="cart-drawer" id="cartDrawer"
       role="dialog" aria-modal="true" aria-label="Giỏ hàng">

  <div class="cart-drawer__head">
    <h2 class="cart-drawer__title">
      Giỏ hàng
      <sub id="cartDrawerCount"></sub>
    </h2>
    <button class="btn-close-cart" id="closeCartBtn" aria-label="Đóng">✕</button>
  </div>

  <div class="cart-drawer__body" id="cartBody">
    <div class="cart-empty">
      <div class="cart-empty__icon">🛒</div>
      <div class="cart-empty__text">Giỏ hàng trống<br>Hãy thêm món bạn muốn!</div>
    </div>
  </div>

  <div class="cart-drawer__foot">
    <div class="cart-note">
      <label for="cartNote">Ghi chú cho bếp</label>
      <textarea id="cartNote" rows="2"
        placeholder="VD: Ít cay, không hành, chín kỹ..."></textarea>
    </div>

    <div class="cart-total-row">
      <span class="cart-total-label">Tổng cộng</span>
      <span class="cart-total-value" id="cartTotal">0 ₫</span>
    </div>

    <button class="btn-confirm" id="btnConfirmOrder" disabled>
      <div class="spinner" id="confirmSpinner"></div>
      <span>Xác nhận gọi món</span>
    </button>
  </div>

</aside>


<!-- ══════════════════════════════════════════
     STATUS PANEL
════════════════════════════════════════════ -->
<div class="status-panel" id="statusPanel">

  <div class="status-drawer" id="statusDrawer" aria-live="polite">
    <div class="status-drawer__head">
      <span class="status-drawer__head-title">Trạng thái món</span>
      <span class="status-refresh-time" id="statusRefreshTime"></span>
    </div>
    <div class="status-drawer__body">
      <ul id="statusList" role="list">
        <li class="status-empty">Chưa có món nào được gửi</li>
      </ul>
    </div>
  </div>

  <button class="status-toggle" id="statusToggle" aria-expanded="false">
    <div class="st-pulse" id="stPulse"></div>
    <div class="st-toggle-info">
      <div class="st-toggle-title">🍳 Trạng thái bếp</div>
      <div class="st-toggle-sub" id="stToggleSub">Chưa gọi món</div>
    </div>
    <span class="st-toggle-arrow" aria-hidden="true">▲</span>
  </button>

</div>


<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/order.js"></script>
</body>
</html>
