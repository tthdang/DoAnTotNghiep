<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Register - SB Admin</title>
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <style>
            /* Tùy chỉnh thêm để phần giới tính trông cân đối với form-floating */
            .gender-container {
                border: 1px solid #ced4da;
                border-radius: 0.375rem;
                padding: 0.75rem 0.75rem;
                height: 58px; /* Khớp độ cao với form-floating */
                display: flex;
                align-items: center;
                justify-content: space-around;
            }
            .gender-label {
                font-size: 0.85rem;
                color: #6c757d;
                position: absolute;
                top: -10px;
                left: 10px;
                background: white;
                padding: 0 5px;
            }
        </style>
    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Tạo tài khoản</h3></div>
                                    <div class="card-body">
                                        <form id="registerForm">
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0">
                                                        <input class="form-control" id="inputFirstName" type="text" placeholder="Tên" />
                                                        <label for="inputFirstName">Tên</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <input class="form-control" id="inputLastName" type="text" placeholder="Họ" />
                                                        <label for="inputLastName">Họ</label>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputPhone" type="tel" placeholder="085..." />
                                                <label for="inputPhone">Số điện thoại</label>
                                            </div>

                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0">
                                                        <input class="form-control" id="inputDoB" type="date" />
                                                        <label for="inputDoB">Ngày sinh</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="position-relative">
                                                        <span class="gender-label">Giới tính</span>
                                                        <div class="gender-container">
                                                            <div class="form-check form-check-inline">
                                                                <input class="form-check-input" type="radio" name="userGender" id="genderMale" value="MALE" checked>
                                                                <label class="form-check-label" for="genderMale">Nam</label>
                                                            </div>
                                                            <div class="form-check form-check-inline">
                                                                <input class="form-check-input" type="radio" name="userGender" id="genderFemale" value="FEMALE">
                                                                <label class="form-check-label" for="genderFemale">Nữ</label>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0 position-relative">
                                                        <input class="form-control" id="inputPassword" type="password" placeholder="Mật khẩu" />
                                                        <label for="inputPassword">Mật khẩu</label>
                                                        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; z-index: 10;">
                                                            <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
                                                        </span>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0 position-relative">
                                                        <input class="form-control" id="inputPasswordConfirm" type="password" placeholder="Xác nhận mật khẩu" />
                                                        <label for="inputPasswordConfirm">Xác nhận mật khẩu</label>
                                                        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; z-index: 10;">
                                                            <i class="fa-solid fa-eye-slash" id="togglePasswordConfirm"></i>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="mt-4 mb-0">
                                                <div class="d-flex gap-2">
                                                    <a class="btn btn-secondary w-100" href="homePage.html">Quay lại</a>
                                                    <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><a href="login.html">Đã có tài khoản? Đi đến đăng nhập</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/register.js"></script>
    </body>
</html>
